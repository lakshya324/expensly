name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        run: npm ci
        working-directory: backend

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Backend typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Backend lint
        run: npm run lint
        working-directory: backend

      - name: Backend tests
        run: npm run test
        working-directory: backend

      - name: Backend build
        run: npm run build
        working-directory: backend

      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend tests
        run: npm run test
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Security audit
        run: npm run audit:ci
