<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Expensly - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            margin: auto;
            background: #1e293b;
            padding: 40px;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        h2 {
            margin-bottom: 10px;
        }

        button {
            margin: 5px 0;
            padding: 8px;
            width: 100%;
            cursor: pointer;
        }

        input,
        select {
            width: 100%;
            padding: 6px;
            margin: 5px 0 10px;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form h3 {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form input {
            width: 100%;
            /* max-width: 420px; */
            /* padding: 10px; */
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
        }

        .form button {
            width: 100%;
            background: #3b82f6;
            color: #f1f5f9;
            border: none;
            border-radius: 8px;
        }

        .form button:hover {
            background: #2563eb;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #3b82f6;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: -10px;
        }

        .logo p {
            color: #94a3b8;
            font-size: 14px;
        }

        .login-selector {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .login-selector button {
            flex: 1;
            background: #334155;
            color: #f1f5f9;
            border: none;
            padding: 10px;
            margin: 0 5px;
            border-radius: 8px;
        }

        .login-selector button.active,
        .login-selector button:hover {
            background: #3b82f6;
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="logo">
            <h1>Expensly</h1>
            <p>Enterprise Expense Auditor</p>
        </div>

        <div class="login-selector">
            <button class="active" data-type="user">User Login</button>
            <button data-type="admin">Admin Login</button>
            <button data-type="signup">Sign Up Organization</button>
        </div>

        <div id="error" class="error"></div>

        <!-- User -->
        <form id="user" class="form active">
            <h3>User Login</h3>
            <input type="email" id="userEmail" placeholder="Email" required>
            <input type="password" id="userPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- Admin -->
        <form id="admin" class="form">
            <h3>Admin Login</h3>
            <input type="email" id="adminEmail" placeholder="Admin Email" required>
            <input type="password" id="adminPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- Admin Signup -->
        <form id="signup" class="form">
            <h3>Create Organization</h3>
            <input type="text" id="orgName" placeholder="Organization Name" required>
            <input type="email" id="orgEmail" placeholder="Admin Email" required>
            <input type="password" id="orgPassword" placeholder="Password" required>
            <input type="password" id="orgPasswordConfirm" placeholder="Confirm Password" required>
            <button type="submit">Create</button>
        </form>
    </div>

    <script>
        function showForm(type) {
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.getElementById(type).classList.add('active');
            errorBox.textContent = '';
        }

        function showError(msg) {
            errorBox.textContent = msg;
        }

        const loginButtons = document.querySelectorAll('.login-selector button');
        const errorBox = document.getElementById('error');

        loginButtons.forEach(button => {
            button.addEventListener('click', () => {
                loginButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                showForm(button.getAttribute('data-type'));
            });
        });

        document.getElementById('user').onsubmit = async e => {
            e.preventDefault();
            try {
                // user login
                location.href = 'index.html';
            } catch (err) {
                showError(err.message);
            }
        };

        document.getElementById('admin').onsubmit = async e => {
            e.preventDefault();
            try {
                // admin login
                location.href = 'index.html';
            } catch (err) {
                showError(err.message);
            }
        };

        document.getElementById('signup').onsubmit = async e => {
            e.preventDefault();

            if (orgPassword.value !== orgPasswordConfirm.value) {
                showError('Passwords do not match');
                return;
            }

            try {
                // create organization
                alert('Organization created. Login as admin.');
                showForm('admin');
                adminEmail.value = orgEmail.value;
            } catch (err) {
                showError(err.message);
            }
        };
    </script>

</body>

</html>
