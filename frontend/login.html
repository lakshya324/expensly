<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Expensly - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            margin: auto;
            background: #1e293b;
            padding: 40px;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        h2 {
            margin-bottom: 10px;
        }

        button {
            margin: 5px 0;
            padding: 8px;
            width: 100%;
            cursor: pointer;
        }

        input,
        select {
            box-sizing: border-box;
            width: 100%;
            padding: 6px;
            margin: 5px 0 10px;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form h3 {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form input {
            width: 100%;
            /* max-width: 420px; */
            /* padding: 10px; */
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
        }

        .form button {
            width: 100%;
            background: #3b82f6;
            color: #f1f5f9;
            border: none;
            border-radius: 8px;
        }

        .form button:hover {
            background: #2563eb;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #3b82f6;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: -10px;
        }

        .logo p {
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">
            <h1>Expensly</h1>
            <p>Enterprise Expense Auditor</p>
        </div>

        <div id="error" class="error"></div>

        <!-- Unified Login -->
        <form id="loginForm" class="form active">
            <h3>Sign In</h3>
            <input type="email" id="email" placeholder="Email" required autocomplete="email">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit">Login</button>
        </form>
    </div>


    <!-- <script defer type="module" src="js/main.js"></script> -->
    <script defer type="module" src="js/auth.js"></script>
    <script type="module">
        import { AuthManager } from './js/auth.js';
        import { UserSession } from './js/storage/session.js';

        const errorBox = document.getElementById('error');
        const emailRegex = /\S+@\S+\.\S+/;
        const passwordRegex = /.{6,}/;

        function showError(msg) {
            errorBox.textContent = msg;
        }

        document.getElementById('loginForm').onsubmit = async e => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }
            if (!emailRegex.test(email)) {
                showError('Please enter a valid email');
                return;
            }
            if (!passwordRegex.test(password)) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            try {
                const session = await AuthManager.login(email, password);
                
                // Redirect based on user type
                if (session.isSuperAdmin) {
                    location.href = 'super-admin.html';
                } else {
                    location.href = 'index.html';
                }
            } catch (err) {
                showError(err.message);
            }
        };

        if(UserSession.isLoggedIn()) {
            const session = UserSession.get();
            if (session.isSuperAdmin) {
                location.href = 'super-admin.html';
            } else {
                location.href = 'index.html';
            }
        }
    </script>

</body>

</html>
