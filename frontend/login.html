<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Expensly - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            margin: auto;
            background: #1e293b;
            padding: 40px;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        h2 {
            margin-bottom: 10px;
        }

        button {
            margin: 5px 0;
            padding: 8px;
            width: 100%;
            cursor: pointer;
        }

        input,
        select {
            width: 100%;
            padding: 6px;
            margin: 5px 0 10px;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <div class="container">
        <h2 class="text-blue-500 text-[32px] font-bold">Expensly</h2>

        <button onclick="">User Login</button>
        <button onclick="">Admin Login</button>
        <button onclick="">Sign Up Organization</button>

        <div id="error" class="error"></div>

        <!-- User -->
        <form id="user" class="form active">
            <h3>User Login</h3>
            <input type="email" id="userEmail" placeholder="Email" required>
            <input type="password" id="userPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- Admin -->
        <form id="admin" class="form">
            <h3>Admin Login</h3>
            <input type="email" id="adminEmail" placeholder="Admin Email" required>
            <input type="password" id="adminPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- Admin Signup -->
        <form id="signup" class="form">
            <h3>Create Organization</h3>
            <input type="text" id="orgName" placeholder="Organization Name" required>
            <input type="email" id="orgEmail" placeholder="Admin Email" required>
            <input type="password" id="orgPassword" placeholder="Password" required>
            <input type="password" id="orgPasswordConfirm" placeholder="Confirm Password" required>
            <button type="submit">Create</button>
        </form>
    </div>

    <script src=""></script>

</body>

</html>
