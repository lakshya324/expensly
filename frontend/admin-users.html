</head>

<body>
    <!-- header -->
    <header class="header">
        <div class="container">
            <div class="left" style="cursor: pointer;" onclick="window.location.href='index.html'">

            </div>

                    </select>
                </div> -->

                <!-- user info -->
                <div>
                    <span class="user-name">Loading...</span>
                    <span class="user-dept"></span>
                </div>
            </div>

            <div class="right">
                <!-- status indicators -->
                <!-- <div class="status-matrix">
                    <div class="status-indicator" id="status-ws" title="WebSocket">
                        <span class="led"></span>
                        <span class="label">WS</span>
                    </div>
                    <div class="status-indicator" id="status-sse" title="Server-Sent Events">
                        <span class="led"></span>
                        <span class="label">SSE</span>
                    </div>
                    <div class="status-indicator" id="status-lp" title="Long Polling">
                        <span class="led"></span>

                    <div class="status-indicator" id="status-sp" title="Short Polling">

                    </div>
                </div> -->

                <!-- offline badge -->
                <!-- <div class="offline-badge" id="offline-badge">
                    <span class="count" id="queue-count">0</span>
                    <span class="label">Pending Sync</span>
                </div> -->

                <!-- diagnostic button -->
                <button class="btn-diagnostic" id="btn-diagnostic" title="Event Loop Diagnostic">
                    Diagnostic
                </button>

                <!-- logout button -->
                <button class="btn-logout" id="logoutBtn" title="Logout">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- main content -->
    <div class="user-management-container">
        <div class="user-management-content">
            <h2>User Management</h2>

            <!-- add user form -->
            <div class="user-mgmt-section">
                <h3>Add New User</h3>
                <form id="add-user-form" class="add-user-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="user-name">Full Name</label>
                            <input type="text" id="user-name" placeholder="Lakshya Sharma" required>
                        </div>

                        <div class="form-group">
                            <label for="user-email">Email</label>
                            <input type="email" id="user-email" placeholder="lakshya@expensly.com" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="user-password">Password</label>
                            <input type="password" id="user-password" placeholder="Enter password" required
                                minlength="6">
                        </div>

                        <div class="form-group">
                            <label for="user-department">Department</label>
                            <select id="user-department" required>
                                <option value="">Select Department</option>
                                <option value="Finance">Finance</option>
                                <option value="IT">IT</option>
                                <option value="Sales">Sales</option>
                                <option value="Marketing">Marketing</option>
                                <option value="HR">HR</option>
                                <option value="Operations">Operations</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="user-manager">Manager (Optional)</label>
                            <select id="user-manager">
                                <option value="">No Manager</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn-submit">Add User</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- list of users -->
            <div class="user-mgmt-section">
                <h3>All Users</h3>
                <div class="users-table-container">
                    <table class="users-table" id="usersTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Manager</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="5" class="empty-state">No users yet. Add your first user above.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- edit user modal -->
            <div id="editUserModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <h3>Edit User</h3>
                    <form id="edit-user-form">
                        <input type="hidden" id="edit-user-id">

                        <div class="form-group">
                            <label for="edit-user-name">Full Name</label>
                            <input type="text" id="edit-user-name" required>
                        </div>

                        <div class="form-group">
                            <label for="edit-user-email">Email</label>
                            <input type="email" id="edit-user-email" required>
                        </div>

                        <div class="form-group">
                            <label for="edit-user-department">Department</label>
                            <select id="edit-user-department" required>
                                <option value="">Select Department</option>
                                <option value="Finance">Finance</option>
                                <option value="IT">IT</option>
                                <option value="Sales">Sales</option>
                                <option value="Marketing">Marketing</option>
                                <option value="HR">HR</option>
                                <option value="Operations">Operations</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="edit-user-manager">Manager (Optional)</label>
                            <select id="edit-user-manager">
                                <option value="">No Manager</option>
                            </select>
                        </div>

                        <div class="modal-actions">
                            <button type="submit" class="btn-submit">Save Changes</button>
                            <button type="button" class="btn-clear" id="cancelEditBtn">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- footer -->
    <footer class="footer">
        <div class="container">
            <p>Expensly © 2026 - Expense Management System</p>
        </div>
    </footer>

    <script type="module">
        import { UserSession } from './js/storage/session.js';
        import { UserPreferenceLocal } from './js/storage/local.js';
        import { AppState } from './js/data/state.js';
        import {
            setupAdminUsersPage,
            renderUsersTable,
            setupEditUserModal
        } from './js/admin-users.js';

        if (!UserSession.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        const user = UserSession.get();
        if (!user.isAdmin) {
            alert('Access denied. Admin privileges required.');
            window.location.href = 'index.html';
        }

        // Display user info
        document.querySelector('.user-name').textContent = user.name;
        // document.querySelector('.user-dept').textContent = user.department;
        document.querySelector('.user-dept').textContent = user.orgName;

        // Currency preference
        /* const currencyPref = UserPreferenceLocal.getCurrency();
        document.getElementById('currencySelect').value = currencyPref;

        document.getElementById('currencySelect').addEventListener('change', (e) => {
            const newCurrency = e.target.value;
            UserPreferenceLocal.set({ currency: newCurrency });
            window.location.reload();
        }); */

        // Setup user management
        await setupAdminUsersPage();

        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to logout?')) {
                UserSession.clear();
                window.location.href = 'login.html';
            }
        });

    </script>
</body>

</html>
