services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - redis
    ports:
      - "3000:3000"
    command: ["node", "dist/index.js"]

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - redis
    command: ["node", "dist/workers/index.js"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
        VITE_WS_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo-data:
